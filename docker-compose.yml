version: "3.9"

services:
  # ── Streamlit UI ────────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: agriintel:latest
    container_name: agriintel-ui
    ports:
      - "8501:8501"
    environment:
      - AGRIINTEL_ENV=production
      - AGRIINTEL_DB_NAME=/data/agri_intel.db
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - agriintel-data:/data
      - agriintel-mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    image: agriintel:latest
    container_name: agriintel-api
    command: ["uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - AGRIINTEL_ENV=production
      - AGRIINTEL_DB_NAME=/data/agri_intel.db
    env_file:
      - .env
    volumes:
      - agriintel-data:/data
    depends_on:
      streamlit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agriintel-data:
    driver: local
  agriintel-mlruns:
    driver: local
