[project]
name = "agriintel"
version = "2.0.0"
description = "Advanced AI Market Intelligence for Indian Agriculture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0,<0.28.0",
    "ruff>=0.1.0",
]
voice = [
    "SpeechRecognition>=3.10.0",
    "gTTS>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that require network access or external services",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # Line length — handled by line-length setting above
    "E402",   # Module-level import not at top — common in Streamlit scripts with sys.path manipulation
    "E701",   # Multiple statements on one line — pre-existing in some agents
    "F401",   # Unused import — pre-existing in some modules
    "E741",   # Ambiguous variable name — pre-existing in some agents
]

[tool.coverage.run]
source = ["app", "agents", "database", "etl", "cv", "utils"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
